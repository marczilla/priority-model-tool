name: Deploy

# Builds and deploys the State Funding Priority Model tool to GitHub Pages
# on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install jsonschema

      - name: Sync embedded data
        run: python build_embedded_data.py

      - name: Validate schema and configs
        run: python tests/test_schema_validation.py

      - name: Run engine tests
        run: python tests/test_engine.py

      - name: Run JS configurator smoke tests
        run: node tests/smoketest_configurator.js

      - name: Run JS wizard smoke tests
        run: node tests/smoketest_wizard.js

      - name: Run JS generator smoke tests
        run: node tests/smoketest_generators.js

      - name: Build deploy bundle
        run: python build_deploy.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
